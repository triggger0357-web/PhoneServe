<!DOCTYPE html>
<html>
<head>
    <title>PhoneServe Texting</title>
    <style>
        body { background:#111; color:white; font-family:Arial; padding:20px; }
        #messages { border:1px solid #444; height:300px; overflow:auto; padding:10px; }
        input, button { padding:10px; margin-top:10px; width:100%; }
    </style>
</head>
<body>

<h2>PhoneServe Texting</h2>

<div>
    Your Number: <input id="from" value="PS-555-0001">
    Contact Number: <input id="to" value="PS-555-0002">
</div>

<div id="messages"></div>

<input id="text" placeholder="Type message...">
<button onclick="sendMessage()">Send</button>
<button onclick="loadMessages()">Refresh</button>

<script>
const API = "http://localhost:3000";

async function loadMessages() {
    const res = await fetch(API + "/getMessages");
    const msgs = await res.json();

    const box = document.getElementById("messages");
    box.innerHTML = "";

    msgs.forEach(m => {
        const div = document.createElement("div");
        div.textContent = `${m.from} → ${m.to}: ${m.text}`;
        box.appendChild(div);
    });
}

async function sendMessage() {
    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;
    const text = document.getElementById("text").value;

    await fetch(API + "/sendMessage", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ from, to, text })
    });

    document.getElementById("text").value = "";
    loadMessages();
}

loadMessages();
</script>

</body>
</html>
