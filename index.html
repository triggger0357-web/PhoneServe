function Av({name,size=36,color}){
  const ini=name.split(" ").map(w=>w[0]).slice(0,2).join("");
  const pool=["#00b8d4","#6200ea","#00bfa5","#c6a700","#1565c0","#d50000"];

}

function PhonePage(){
  const [active,setActive]=useState("dialer");
  const [dialNum,setDialNum]=useState("");
  const [calling,setCalling]=useState(false);
  const [callWith,setCallWith]=useState(null);
  const [callTimer,setCallTimer]=useState(0);
  const timerRef=useRef(null);

  const dial=d=>{if(d==="⌫")setDialNum(p=>p.slice(0,-1));else setDialNum(p=>p+d);};
  const startCall=(name,num)=>{
    setCallWith({name:name||num,num});setCalling(true);setCallTimer(0);
    timerRef.current=setInterval(()=>setCallTimer(t=>t+1),1000);
  };
  const endCall=()=>{setCalling(false);setCallWith(null);clearInterval(timerRef.current);setCallTimer(0);};
  const fmt=s=>{const m=Math.floor(s/60),sec=s%60;return m+":"+(sec<10?"0":"")+sec;};

  if(calling)return(
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:20,background:"linear-gradient(135deg,#0d1117,#091420)"}}>
      <div style={{animation:"ring 1.5s infinite"}}>
        <Av name={callWith.name} size={80} />
      </div>
      <div style={{textAlign:"center"}}>
        <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:22,color:"#e2e8f0"}}>{callWith.name}</div>
        <div style={{fontSize:12,color:"#4a5568",marginTop:4}}>{callWith.num}</div>
        <div style={{fontSize:18,fontWeight:700,color:"#00e5ff",marginTop:8}}>{fmt(callTimer)}</div>
        <div style={{fontSize:10,color:"#374151",marginTop:4}}>Edge Tech Knowledgey Network · {DOMAIN}</div>
      </div>
      <div style={{display:"flex",gap:20,marginTop:10}}>
        {[{icon:"🔇",label:"Mute"},{icon:"📢",label:"Speaker"},{icon:"🎥",label:"Video"},{icon:"⌨️",label:"Keypad"}].map(b=>(
          <div key={b.label} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
            <button style={{width:52,height:52,borderRadius:"50%",background:"rgba(255,255,255,0.08)",fontSize:20,border:"none",cursor:"pointer"}}>{b.icon}</button>
            <span style={{fontSize:9,color:"#4a5568"}}>{b.label}</span>
          </div>
        ))}
      </div>
      <button onClick={endCall} style={{width:64,height:64,borderRadius:"50%",background:"#f44336",fontSize:26,border:"none",cursor:"pointer",marginTop:10,boxShadow:"0 0 24px rgba(244,67,54,0.4)"}}>📵</button>
    </div>
  );

  return(
    <div style={{flex:1,display:"flex",overflow:"hidden"}}>
      <div style={{width:180,background:"#0d1117",borderRight:"1px solid #1a2133",display:"flex",flexDirection:"column",padding:"14px 0",flexShrink:0}}>
        <div style={{padding:"0 12px 14px",fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:13,color:"#e2e8f0"}}>📞 Phone</div>
        {[{id:"dialer",icon:"⌨️",label:"Dialer"},{id:"recents",icon:"🕐",label:"Recents"},{id:"voicemail",icon:"📬",label:"Voicemail"}].map(t=>(
          <button key={t.id} onClick={()=>setActive(t.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 14px",width:"100%",background:active===t.id?"rgba(0,229,255,0.08)":"transparent",borderLeft:active===t.id?"2px solid #00e5ff":"2px solid transparent",color:active===t.id?"#e2e8f0":"#4b5563",fontSize:12,fontWeight:500,cursor:"pointer",border:"none"}}>
            <span>{t.icon}</span><span>{t.label}</span>
          </button>
        ))}
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}}>
        {active==="dialer"&&(
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,width:"100%",maxWidth:280}}>

                <button key={k} onClick={()=>dial(k)} style={{height:52,borderRadius:"50%",background:"#111827",border:"1px solid #1a2133",fontSize:18,fontWeight:700,color:"#e2e8f0",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{k}</button>
              ))}
            </div>
            <button onClick={()=>dialNum&&startCall(null,dialNum)} style={{width:56,height:56,borderRadius:"50%",background:"#00e5ff",fontSize:22,border:"none",cursor:"pointer",boxShadow:"0 0 20px rgba(0,229,255,0.3)",marginTop:8}}>📞</button>

          </div>
        )}
        {active==="voicemail"&&(
          <div style={{width:"100%",maxWidth:400,textAlign:"center",padding:24,background:"#0d1117",border:"1px solid #1a2133",borderRadius:12}}>
            <div style={{fontSize:32,marginBottom:8}}>📬</div>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:16}}>Voice Inbox</div>
            <div style={{fontSize:12,color:"#4a5568",marginTop:4}}>No new voicemails. Acoustic transcription active.</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(ADMIN);
  const [tab,setTab]=useState("email");
  const [emails,setEmails]=useState(EMAILS);
  const [selEmail,setSelEmail]=useState(null);
  const [aiMode,setAiMode]=useState("advisor");
  const [aiMsgs,setAiMsgs]=useState([
    {role:"assistant",content:"Hello David! I'm your Edge Tech Knowledgey executive advisor. How can we accelerate growth today?"}
  ]);
  const [aiInput,setAiInput]=useState("");
  const [aiLoading,setAiLoading]=useState(false);

  if(!user) return <SignUp onLogin={u=>setUser(u)}/>;

  const handleAiSend=(txt)=>{
    const q=txt||aiInput;
    if(!q.trim())return;
    const next=[...aiMsgs,{role:"user",content:q}];
    setAiMsgs(next);
    setAiInput("");
    setAiLoading(true);
    setTimeout(()=>{
      setAiMsgs([...next,{role:"assistant",content:`Analyzing "${q}" under mode [${aiMode.toUpperCase()}]. Everything is nominal across ${DOMAIN}. Let's execute.`}]);
      setAiLoading(false);
    },800);
  };

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{height:52,background:"#0d1117",borderBottom:"1px solid #1a2133",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 16px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:26,height:26,borderRadius:6,background:"linear-gradient(135deg,#00e5ff,#0077ff)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>⚡</div>
          <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:15}}>Edge Tech <span style={{color:"#00e5ff"}}>Knowledgey</span></span>
          <Chip label={user.plan} color={user.plan==="owner"?"#ffd740":"#00e5ff"} />
        </div>

        <div style={{display:"flex",gap:4,background:"#111827",padding:3,borderRadius:8}}>
          {[
            {id:"email",label:"✉️ Email"},
            {id:"phone",label:"📞 Phone"},
            {id:"contacts",label:"📇 Contacts"},
            {id:"photos",label:"🖼️ Photos"},
            {id:"ai",label:"🤖 AI Assistant"},
            {id:"users",label:"👥 Team"},
            {id:"settings",label:"⚙️ Settings"}
          ].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{background:tab===t.id?"#1e2a3a":"transparent",color:tab===t.id?"#00e5ff":"#64748b",border:"none",padding:"5px 10px",borderRadius:6,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
              {t.label}
            </button>
          ))}
        </div>

        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <Av name={user.name} size={30} />
          <span style={{fontSize:12,fontWeight:700}}>{user.name}</span>
          <button onClick={()=>setUser(null)} style={{background:"#1a2133",color:"#f44336",border:"none",padding:"4px 8px",borderRadius:6,fontSize:10,fontWeight:700,cursor:"pointer"}}>Logout</button>
        </div>
      </div>

      <div style={{flex:1,display:"flex",overflow:"hidden",background:"#0a0c10"}}>
        {tab==="email"&&(
          <div style={{flex:1,display:"flex",overflow:"hidden"}}>
            <div style={{width:320,background:"#0d1117",borderRight:"1px solid #1a2133",display:"flex",flexDirection:"column"}}>
              <div style={{padding:12,borderBottom:"1px solid #1a2133",fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:14}}>Inbox ({emails.filter(e=>!e.read).length})</div>
              <div style={{flex:1,overflowY:"auto"}}>
                {emails.map(e=>(
                  <div key={e.id} onClick={()=>setSelEmail(e)} style={{padding:12,borderBottom:"1px solid #1a2133",background:selEmail?.id===e.id?"#161f30":e.read?"transparent":"rgba(0,229,255,0.03)",cursor:"pointer"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                      <span style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:12,color:e.read?"#94a3b8":"#fff"}}>{e.from}</span>
                      <span style={{fontSize:10,color:"#4a5568"}}>{e.time}</span>
                    </div>
                    <div style={{fontSize:11,fontWeight:600,color:"#e2e8f0",marginBottom:3}}>{e.subj}</div>
                    <Chip label={e.tag} color={e.tc} />
                  </div>
                ))}
              </div>
            </div>
            <div style={{flex:1,display:"flex",flexDirection:"column",background:"#0a0c10",padding:24,overflowY:"auto"}}>
              {selEmail?(
                <div>
                  <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,marginBottom:8}}>{selEmail.subj}</div>
                  <div style={{fontSize:12,color:"#4a5568",marginBottom:16}}>From: {selEmail.from} &lt;{selEmail.fe}&gt; · {selEmail.time}</div>
                  <div style={{background:"#0d1117",border:"1px solid #1a2133",borderRadius:10,padding:16,whiteSpace:"pre-wrap",fontSize:13,lineHeight:1.6}}>{selEmail.body}</div>
                </div>
              ):(
                <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"#4a5568",fontSize:13}}>Select an email to read</div>
              )}
            </div>
          </div>
        )}

        {tab==="phone"&&<PhonePage/>}

        {tab==="contacts"&&(
          <div style={{flex:1,padding:24,overflowY:"auto"}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,marginBottom:16}}>Contacts & Directory</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:12}}>
              {CONTACTS.map(c=>(
                <div key={c.id} style={{background:"#0d1117",border:"1px solid #1a2133",borderRadius:10,padding:16,display:"flex",alignItems:"center",gap:12}}>
                  <Av name={c.name} size={42} color={c.color} />
                  <div>
                    <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14}}>{c.name}</div>
                    <div style={{fontSize:11,color:"#00e5ff"}}>{c.company}</div>
                    <div style={{fontSize:11,color:"#4a5568",marginTop:2}}>{c.phone}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab==="photos"&&(
          <div style={{flex:1,padding:24,overflowY:"auto"}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,marginBottom:16}}>Photo Gallery & Storage</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:16}}>
              {PHOTOS.map(p=>(
                <div key={p.id} style={{height:140,borderRadius:12,background:p.gradient,display:"flex",flexDirection:"column",justifyContent:"flex-end",padding:12,boxShadow:"0 4px 12px rgba(0,0,0,0.3)"}}>
                  <div style={{fontSize:24,marginBottom:4}}>{p.emoji}</div>
                  <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,color:"#fff"}}>{p.label}</div>
                  <div style={{fontSize:10,color:"rgba(255,255,255,0.7)"}}>{p.date}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab==="ai"&&(
          <div style={{flex:1,display:"flex",flexDirection:"column",padding:16}}>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              {AI_MODES.map(m=>(
                <button key={m.id} onClick={()=>setAiMode(m.id)} style={{background:aiMode===m.id?m.color+"20":"#0d1117",border:"1px solid "+(aiMode===m.id?m.color:"#1a2133"),color:aiMode===m.id?m.color:"#64748b",padding:"6px 12px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
                  {m.icon} {m.label}
                </button>
              ))}
            </div>
            <div style={{flex:1,background:"#0d1117",border:"1px solid #1a2133",borderRadius:12,padding:16,overflowY:"auto",display:"flex",flexDirection:"column",gap:12,marginBottom:12}}>
              {aiMsgs.map((m,i)=>(
                <div key={i} style={{display:"flex",flexDirection:"column",alignItems:m.role==="user"?"flex-end":"flex-start"}}>
                  <div style={{maxWidth:"75%",background:m.role==="user"?"#00e5ff20":"#161f30",border:"1px solid "+(m.role==="user"?"#00e5ff40":"#1e2a3a"),borderRadius:10,padding:"10px 14px",fontSize:13,lineHeight:1.5,color:"#e2e8f0"}}>
                    {m.content}
                  </div>
                </div>
              ))}
              {aiLoading&&<div style={{fontSize:12,color:"#00e5ff"}}>AI is thinking...</div>}
            </div>
            <div style={{display:"flex",gap:8}}>
              <input value={aiInput} onChange={e=>setAiInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleAiSend()} placeholder="Ask AI assistant..." style={{flex:1,background:"#0d1117",border:"1px solid #1a2133",borderRadius:8,padding:"10px 14px",fontSize:13}}/>
              <Btn onClick={()=>handleAiSend()} style={{background:"#00e5ff",color:"#000",padding:"0 20px",borderRadius:8,border:"none"}}>Send</Btn>
            </div>
          </div>
        )}

        {tab==="users"&&(
          <div style={{flex:1,padding:24,overflowY:"auto"}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,marginBottom:16}}>Team Directory & Subscriptions</div>
            <div style={{background:"#0d1117",border:"1px solid #1a2133",borderRadius:12,overflow:"hidden"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,textAlign:"left"}}>
                <thead>
                  <tr style={{background:"#111827",borderBottom:"1px solid #1a2133",color:"#64748b",fontSize:11,textTransform:"uppercase"}}>
                    <th style={{padding:12}}>Name</th>
                    <th style={{padding:12}}>Email</th>
                    <th style={{padding:12}}>Plan</th>
                    <th style={{padding:12}}>Storage</th>
                    <th style={{padding:12}}>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {USERS.map(u=>(
                    <tr key={u.id} style={{borderBottom:"1px solid #1a2133"}}>
                      <td style={{padding:12,fontWeight:700}}>{u.name}</td>
                      <td style={{padding:12,color:"#64748b"}}>{u.email}</td>
                      <td style={{padding:12}}><Chip label={u.plan} color={u.plan==="owner"?"#ffd740":"#00e5ff"}/></td>
                      <td style={{padding:12}}>{u.storage} GB</td>
                      <td style={{padding:12,color:u.status==="active"?"#69f0ae":"#ffd740"}}>{u.status}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {tab==="settings"&&(
          <div style={{flex:1,padding:24,overflowY:"auto"}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18,marginBottom:16}}>Platform Settings</div>
            <div style={{background:"#0d1117",border:"1px solid #1a2133",borderRadius:12,padding:20,maxWidth:500,display:"flex",flexDirection:"column",gap:16}}>
              <div>
                <label style={{fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",display:"block",marginBottom:6}}>Domain</label>
                <input readOnly value={DOMAIN} style={{width:"100%",background:"#111827",border:"1px solid #1a2133",borderRadius:8,padding:"10px",fontSize:13}}/>
              </div>
              <div>
                <label style={{fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",display:"block",marginBottom:6}}>Account Email</label>
                <input readOnly value={user.email} style={{width:"100%",background:"#111827",border:"1px solid #1a2133",borderRadius:8,padding:"10px",fontSize:13}}/>
              </div>
              <div>
                <label style={{fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",display:"block",marginBottom:6}}>Active Plan</label>
                <input readOnly value={user.plan.toUpperCase()} style={{width:"100%",background:"#111827",border:"1px solid #1a2133",borderRadius:8,padding:"10px",fontSize:13,color:"#00e5ff",fontWeight:700}}/>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
