<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhoneServe - Admin Telemetry Dashboard</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161b26;
      --accent-green: #00ff88;
      --accent-blue: #00bfff;
      --text-color: #e6edf3;
      --text-dim: #8b949e;
      --border-color: #30363d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    h1 { margin: 0; font-size: 1.5rem; color: var(--accent-blue); }
    .status-badge { background: rgba(0, 255, 136, 0.1); color: var(--accent-green); padding: 4px 12px; border-radius: 12px; border: 1px solid var(--accent-green); font-size: 0.85rem; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
    .card-label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .card-value { font-size: 1.6rem; font-weight: bold; margin-top: 8px; color: var(--accent-green); }
    .log-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
    .log-header { font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .log-box { background-color: #05070a; border: 1px solid var(--border-color); border-radius: 6px; height: 280px; overflow-y: auto; padding: 12px; font-family: "Courier New", Courier, monospace; font-size: 0.85rem; color: #39ff14; }
    .log-entry { margin-bottom: 6px; line-height: 1.4; word-break: break-all; }
    .log-entry .ts { color: var(--text-dim); }
    .log-entry .tag-acoustic { color: var(--accent-green); font-weight: bold; }
    .log-entry .tag-info { color: var(--accent-blue); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PhoneServe Telemetry Node</h1>
      <span class="status-badge" id="ws-status">Connecting...</span>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-label">Unclaimed Balance</div>
        <div class="card-value" id="val-balance">$0.000000</div>
      </div>
      <div class="card">
        <div class="card-label">Base Rate / sec</div>
        <div class="card-value" id="val-rate" style="color: var(--accent-blue);">$0.000038</div>
      </div>
      <div class="card">
        <div class="card-label">Verified Strings</div>
        <div class="card-value" id="val-strings" style="color: #ffffff;">0</div>
      </div>
    </div>

    <div class="log-section">
      <div class="log-header">
        <span>Acoustic & String Micro-Mint Log Feed</span>
        <span style="font-size: 0.75rem; color: var(--text-dim);">Listening on ws://127.0.0.1:8080</span>
      </div>
      <div class="log-box" id="log-container">
        <div class="log-entry"><span class="ts">[SYS]</span> Initializing event stream observer...</div>
      </div>
    </div>
  </div>

  <script>
    const wsStatus = document.getElementById('ws-status');
    const valBalance = document.getElementById('val-balance');
    const valRate = document.getElementById('val-rate');
    const valStrings = document.getElementById('val-strings');
    const logContainer = document.getElementById('log-container');

    let lastMinedCount = null;
    let lastBalance = null;

    function addLog(message, isAcoustic = false) {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      
      const tag = isAcoustic 
        ? '<span class="tag-acoustic">[ACOUSTIC 0xAC01]</span>' 
        : '<span class="tag-info">[STRING MINT]</span>';
        
      entry.innerHTML = `<span class="ts">[${timeStr}]</span> ${tag} ${message}`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function connectWS() {
      const ws = new WebSocket('ws://127.0.0.1:8080');

      ws.onopen = () => {
        wsStatus.innerText = 'ONLINE';
        wsStatus.style.borderColor = '#00ff88';
        wsStatus.style.color = '#00ff88';
        addLog('WebSocket connection established with telemetry daemon.');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          
          if (data.user_unclaimed_balance_usd !== undefined) {
            valBalance.innerText = '$' + data.user_unclaimed_balance_usd.toFixed(6);
          }
          if (data.user_current_rate_per_sec !== undefined) {
            valRate.innerText = '$' + data.user_current_rate_per_sec.toFixed(6);
          }
          if (data.mined_strings_count !== undefined) {
            valStrings.innerText = data.mined_strings_count;

            if (lastMinedCount !== null && data.mined_strings_count > lastMinedCount) {
              const deltaBalance = lastBalance !== null 
                ? (data.user_unclaimed_balance_usd - lastBalance).toFixed(6) 
                : '0.001500';
              
              // Highlight micro-mints matching acoustic sound rate ($0.0015)
              const isAcoustic = Math.abs(parseFloat(deltaBalance) - 0.001500) < 0.0001;
              const msg = isAcoustic 
                ? `CRC16 frame verified via microphone stream | +$${deltaBalance}` 
                : `Multi-string proof registered | +$${deltaBalance}`;

              addLog(msg, isAcoustic);
            }
            
            lastMinedCount = data.mined_strings_count;
            lastBalance = data.user_unclaimed_balance_usd;
          }
        } catch (err) {
          console.error('Failed to parse telemetry frame:', err);
        }
      };

      ws.onclose = () => {
        wsStatus.innerText = 'OFFLINE';
        wsStatus.style.borderColor = '#ff4d4d';
        wsStatus.style.color = '#ff4d4d';
        setTimeout(connectWS, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    connectWS();
  </script>
</body>
</html>
