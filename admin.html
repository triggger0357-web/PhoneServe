<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhoneServe Sovereign Admin Node</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --green: #3fb950;
      --red: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 550px; width: 100%; }
    h1 { font-size: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; color: #fff; margin-top: 0; }
    .auth-box {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
    }
    input[type="password"], input[type="text"] {
      flex: 1;
      background: #010409;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.85rem;
    }
    button {
      background: #21262d;
      border: 1px solid var(--border);
      color: #c9d1d9;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
    }
    button:hover { background: #30363d; color: #fff; }
    button.primary { background: #238636; color: #fff; border-color: #2ea043; }
    button.primary:hover { background: #2ea043; }
    .status-bar {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-size: 0.75rem;
    }
    .badge.online { background: rgba(46,160,67,0.2); color: var(--green); border: 1px solid var(--green); }
    .badge.offline { background: rgba(248,81,73,0.2); color: var(--red); border: 1px solid var(--red); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); padding: 14px; border-radius: 6px; }
    .card .label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; margin-bottom: 4px; }
    .card .value { font-size: 1.25rem; font-weight: bold; color: #fff; }
    .console {
      background: #010409;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 0.75rem;
      height: 140px;
      overflow-y: auto;
      color: #7ee787;
      font-family: monospace;
      margin-bottom: 16px;
    }
    .console-line { margin-bottom: 4px; word-break: break-all; }
    .console-line.err { color: var(--red); }
    .controls { display: flex; gap: 8px; margin-bottom: 16px; }
    .footer { font-size: 0.75rem; color: #8b949e; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>PhoneServe Sovereign Admin Node</h1>

    <div class="auth-box">
      <input type="password" id="auth-token" placeholder="Enter Sovereign Auth Key..." />
      <button onclick="saveToken()" class="primary">Save Key</button>
    </div>

    <div class="status-bar">
      <span>Node Telemetry</span>
      <span id="node-status" class="badge offline">DISCONNECTED</span>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">Active Peers</div>
        <div id="peers-count" class="value">--</div>
      </div>
      <div class="card">
        <div class="label">Uptime</div>
        <div id="uptime" class="value">--</div>
      </div>
      <div class="card">
        <div class="label">Bandwidth RX</div>
        <div id="bw-rx" class="value">--</div>
      </div>
      <div class="card">
        <div class="label">Bandwidth TX</div>
        <div id="bw-tx" class="value">--</div>
      </div>
    </div>

    <div class="controls">
      <button onclick="fetchTelemetry()">Force Poll</button>
      <button onclick="clearConsole()">Clear Logs</button>
      <button onclick="resetKey()">Reset Key</button>
    </div>

    <div class="console" id="console-log">
      <div class="console-line">[INIT] Sovereign console ready. Polling endpoint...</div>
    </div>

    <div class="footer">
      Compliance: <span id="compliance">--</span> | Refreshed: <span id="last-updated">--</span>
    </div>
  </div>

  <script>
    const DEFAULT_KEY = '2026-18plus-v1-secure-key';

    function getKey() {
      return localStorage.getItem('phoneserve_admin_key') || DEFAULT_KEY;
    }

    document.getElementById('auth-token').value = getKey();

    function saveToken() {
      const val = document.getElementById('auth-token').value.trim();
      if (val) {
        localStorage.setItem('phoneserve_admin_key', val);
        log(`[AUTH] Key stored in localStorage.`);
        fetchTelemetry();
      }
    }

    function resetKey() {
      localStorage.removeItem('phoneserve_admin_key');
      document.getElementById('auth-token').value = DEFAULT_KEY;
      log(`[AUTH] Key reset to default.`);
      fetchTelemetry();
    }

    function log(msg, isErr = false) {
      const consoleEl = document.getElementById('console-log');
      const line = document.createElement('div');
      line.className = isErr ? 'console-line err' : 'console-line';
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function clearConsole() {
      document.getElementById('console-log').innerHTML = '';
    }

    async function fetchTelemetry() {
      const key = getKey();
      try {
        const res = await fetch('/api/admin/telemetry', {
          headers: { 'Authorization': key }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}: Token rejected`);

        const data = await res.json();

        document.getElementById('node-status').textContent = data.nodeStatus;
        document.getElementById('node-status').className = 'badge online';
        document.getElementById('peers-count').textContent = data.peersConnected;
        document.getElementById('uptime').textContent = `${data.uptimeSeconds}s`;
        document.getElementById('bw-rx').textContent = `${data.bandwidth.rx_kb} KB`;
        document.getElementById('bw-tx').textContent = `${data.bandwidth.tx_kb} KB`;
        document.getElementById('compliance').textContent = data.compliance;
        document.getElementById('last-updated').textContent = new Date(data.timestamp).toLocaleTimeString();

        log(`[TELEMETRY] Node status: ${data.nodeStatus} | Peers: ${data.peersConnected}`);
      } catch (err) {
        document.getElementById('node-status').textContent = 'OFFLINE';
        document.getElementById('node-status').className = 'badge offline';
        log(`[ERROR] ${err.message}`, true);
      }
    }

    fetchTelemetry();
    setInterval(fetchTelemetry, 3000);
  </script>
</body>
</html>
