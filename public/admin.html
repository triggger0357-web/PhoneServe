<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhoneServe Admin Panel</title>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
    h1 { font-size: 1.5rem; color: #38bdf8; }
    .card { background: #1e293b; padding: 16px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 16px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-weight: bold; font-size: 0.85rem; }
    .badge-active { background: #059669; color: #ecfdf5; }
    .badge-unauth { background: #dc2626; color: #fef2f2; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 16px; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
    .stat-val { font-size: 1.25rem; font-weight: bold; margin-top: 4px; color: #f8fafc; }
  </style>
</head>
<body>
  <h1>PhoneServe Admin Node</h1>
  <div class="card">
    <div>Status: <span id="status-badge" class="badge badge-unauth">CONNECTING...</span></div>
    <div class="grid">
      <div class="card"><div class="stat-label">Active Peers</div><div id="peer-count" class="stat-val">--</div></div>
      <div class="card"><div class="stat-label">Bandwidth RX</div><div id="bandwidth-rx" class="stat-val">--</div></div>
      <div class="card"><div class="stat-label">Bandwidth TX</div><div id="bandwidth-tx" class="stat-val">--</div></div>
    </div>
  </div>
  <script>
    async function fetchNodeTelemetry() {
      const token = localStorage.getItem('phoneserve_admin_token') || '2026-18plus-v1-secure-key';
      try {
        const res = await fetch('/api/admin/telemetry', { headers: { 'Authorization': token } });
        if (!res.ok) throw new Error('Unauthorized');
        const data = await res.json();
        const badge = document.getElementById('status-badge');
        badge.textContent = data.nodeStatus.toUpperCase();
        badge.className = 'badge badge-active';
        document.getElementById('peer-count').textContent = data.peersConnected;
        document.getElementById('bandwidth-rx').textContent = data.bandwidth.rx_kb + ' KB';
        document.getElementById('bandwidth-tx').textContent = data.bandwidth.tx_kb + ' KB';
      } catch (err) {
        const badge = document.getElementById('status-badge');
        badge.textContent = 'UNAUTHORIZED';
        badge.className = 'badge badge-unauth';
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      fetchNodeTelemetry();
      setInterval(fetchNodeTelemetry, 5000);
    });
  </script>
</body>
</html>
