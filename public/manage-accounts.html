<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETK Admin</title><style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:20px}.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:16px;margin:10px 0}button{padding:8px 12px;margin:4px;border-radius:6px;border:0;cursor:pointer}.approve{background:#0f0;color:#000}.reject{background:#f33;color:#fff}</style></head><body><h1>ETK Sovereign - Admin</h1><div id="pending"></div><div id="users"></div><script>async function load(){const r=await fetch('http://127.0.0.1:8585/api/accounts');const j=await r.json();let ph='<h2>Pending</h2>';(j.signups||[]).forEach(s=>{ph+=`<div class="card">${s.username} (${s.display_name}) - ${s.email} <button class=approve onclick="approve('${s.username}')">Approve</button> <button class=reject onclick="reject('${s.username}')">Reject</button></div>`});if((j.signups||[]).length==0)ph+='<p>None</p>';let uh='<h2>Active Users</h2>';(j.users||[]).forEach(u=>{uh+=`<div class="card">${u.username} - ${u.email} - ${u.tier}</div>`});document.getElementById('pending').innerHTML=ph;document.getElementById('users').innerHTML=uh}async function approve(u){await fetch('http://127.0.0.1:8585/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u})});load()}async function reject(u){await fetch('http://127.0.0.1:8585/api/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u})});load()}load()</script></body></html>
