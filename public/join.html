<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join ETK</title><style>body{background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:24px;width:100%;max-width:380px}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#111;color:#fff;box-sizing:border-box}button{width:100%;padding:12px;margin-top:12px;border-radius:8px;border:0;background:#fff;color:#000;font-weight:700;cursor:pointer}.ok{color:#0f0}.err{color:#f55}</style></head><body><div class="card"><h2>Join ETK Sovereign</h2><input id="u" placeholder="username"><input id="d" placeholder="display name"><input id="e" type="password" placeholder="password"><button onclick="go()">Create Account</button><p id="msg"></p></div><script>async function go(){const u=document.getElementById('u').value,d=document.getElementById('d').value,p=document.getElementById('e').value,msg=document.getElementById('msg');if(!u||!p){msg.textContent='need username + password';return}msg.textContent='...';try{const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,display_name:d,password:p,email:u+'@edgetech-knowledgey.fwh.is',tier:'pro'})});const j=await r.json();if(j.ok){msg.className='ok';msg.textContent='Pending approval: '+j.email+' — wait for Chief to approve'}else{msg.className='err';msg.textContent=j.error||'error'}}catch(e){msg.className='err';msg.textContent='Failed: '+e}}</script></body></html>
